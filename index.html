<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Piece Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Merriweather:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="Photos/icon.png">

</head>
<body>
  <div id="quiz-container">

    <h1 id="main-title">One Piece Character Quiz</h1>

    <div id="settings">
      <div class="setting">
        <label for="mode">Game Mode:</label>
        <span class="select-wrap">
          <select id="mode">
            <option value="random">🎲 Random</option>
            <option value="quote">📜 Only Quote</option>
            <option value="emoji">😄 Only Emoji</option>
            <option value="image">🖼️ Only Image</option>
          </select>
        </span>
      </div>
      <div class="setting">
        <label for="lives">Lives:</label>
        <span class="select-wrap">
          <select id="lives">
            <option value="3">❤️ 3 Lives</option>
            <option value="1">💀 1 Life</option>
          </select>
        </span>
      </div>
    </div>

    <div id="question-area">
        <div id="quote">Loading data...</div>
    </div>
    
    <div id="correct-answer-container" aria-live="polite"></div>
    <div id="choices"></div>

    <div id="game-over" hidden>
      <h2 id="game-over-title">Game Over</h2>
      <p id="final-score"></p>
      <p id="new-record" hidden>🏆 New record!</p>
      <p id="final-best"></p>
      <button id="play-again-btn">Play Again</button>
    </div>

    <div id="score-area">
      <div id="score">Streak: 0</div>
      <button id="next-btn">Next Question</button>
    </div>
  </div>

  <script src="one_piece_emojis.js"></script>
  <script src="quotes_fallback.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
